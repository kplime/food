services:
  - type: web
    name: obang-korean-food-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne foodbackend.asgi:application --bind 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.9"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: obang-korean-food-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://food-alpha-sage.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: obang-korean-food-db
          property: connectionString

databases:
  - name: obang-korean-food-db
    plan: free
    databaseName: obang_food
    user: obang
